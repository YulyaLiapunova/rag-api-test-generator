server.port=8090

spring.application.name=RAG API Test Generator
github.access.token=test
repository.base.path=repositories

# Milvus Configuration
milvus.host=http://localhost:19530

# API Generation Configuration
rag.api.base-url=http://localhost:8080/webhook

# Logging Configuration
logging.level.org.springframework.http.converter.json=DEBUG
logging.level.com.fasterxml.jackson=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.aiqa.ragapitestgenerator=DEBUG

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Optional: Set queue retry settings
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=1
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
